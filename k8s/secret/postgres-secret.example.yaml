# Copy to postgres-secret.yaml (gitignored), replace the values, then apply.
# Generate secret-key-base with: docker run --rm oms-api:1.0.0 bin/rails secret
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  postgres-user: oms_api
  postgres-password: CHANGE_ME
  secret-key-base: CHANGE_ME
