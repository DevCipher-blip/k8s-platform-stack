apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
  labels:
    app: webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      automountServiceAccountToken: false
      # If the image lives in a private registry, add:
      # imagePullSecrets:
      #   - name: <registry-credentials>
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webapp
          # Build and tag it yourself: docker build -t oms-api:1.0.0 .
          image: oms-api:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: postgres-url
            - name: POSTGRES_DB
              value: oms_api_production
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres-password
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: secret-key-base
          # db:prepare runs in the entrypoint before puma starts, so the
          # first boot against an empty database takes longer.
          startupProbe:
            httpGet:
              path: /up
              port: 3000
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /up
              port: 3000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: 3000
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The root filesystem is read-only; Rails and Puma write only here.
            - name: tmp
              mountPath: /app/tmp
            - name: system-tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: system-tmp
          emptyDir: {}
