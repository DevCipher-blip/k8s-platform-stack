# Connection settings come from the environment. The fallbacks below only
# serve a local development or test database; production has none, so a
# missing POSTGRES_PASSWORD fails loudly at boot instead of guessing.
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch('DB_HOST', 'localhost') %>
  port: <%= ENV.fetch('DB_PORT', 5432) %>
  pool: <%= ENV.fetch('RAILS_MAX_THREADS', 5) %>

development:
  <<: *default
  database: <%= ENV.fetch('POSTGRES_DB', 'oms_api_development') %>
  username: <%= ENV.fetch('POSTGRES_USER', 'postgres') %>
  password: <%= ENV.fetch('POSTGRES_PASSWORD', 'postgres') %>

test:
  <<: *default
  database: oms_api_test
  username: <%= ENV.fetch('POSTGRES_USER', 'postgres') %>
  password: <%= ENV.fetch('POSTGRES_PASSWORD', 'postgres') %>

production:
  <<: *default
  database: <%= ENV.fetch('POSTGRES_DB', 'oms_api_production') %>
  username: <%= ENV.fetch('POSTGRES_USER') %>
  password: <%= ENV.fetch('POSTGRES_PASSWORD') %>
