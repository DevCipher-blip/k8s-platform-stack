{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.auth.secretName }}
type: Opaque
stringData:
  postgres-user: {{ .Values.auth.postgresUser | quote }}
  postgres-password: {{ required "set auth.postgresPassword or auth.existingSecret" .Values.auth.postgresPassword | quote }}
  secret-key-base: {{ required "set auth.secretKeyBase or auth.existingSecret" .Values.auth.secretKeyBase | quote }}
{{- end }}
