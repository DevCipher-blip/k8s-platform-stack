apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.webapp.name }}
  labels:
    app: {{ .Values.webapp.label }}
spec:
  replicas: {{ .Values.webapp.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.webapp.label }}
  template:
    metadata:
      labels:
        app: {{ .Values.webapp.label }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.webapp.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: webapp
          image: "{{ .Values.webapp.image.repository }}:{{ .Values.webapp.image.tag }}"
          imagePullPolicy: {{ .Values.webapp.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.webapp.port }}
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.configMap.name }}
                  key: postgres-url
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "oms.secretName" . }}
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "oms.secretName" . }}
                  key: postgres-password
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "oms.secretName" . }}
                  key: secret-key-base
          # db:prepare runs in the entrypoint before puma starts, so the
          # first boot against an empty database takes longer.
          startupProbe:
            httpGet:
              path: /up
              port: {{ .Values.webapp.port }}
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /up
              port: {{ .Values.webapp.port }}
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: {{ .Values.webapp.port }}
            periodSeconds: 20
          resources:
            {{- toYaml .Values.webapp.resources | nindent 12 }}
          securityContext:
            readOnlyRootFilesystem: true
            {{- include "oms.restrictedContainer" . | nindent 12 }}
          volumeMounts:
            # The root filesystem is read-only; Rails and Puma write only here.
            - name: tmp
              mountPath: /app/tmp
            - name: system-tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: system-tmp
          emptyDir: {}
