version: '3'
services:
  db:
    image: postgres:14.1
    volumes:
      - postgres:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - 5432:5432

  web:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/oms-api
    ports:
      - 3000:3000
    depends_on:
      - db

volumes:
  postgres:

