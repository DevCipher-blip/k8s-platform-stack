# Local stack: the production image plus PostgreSQL 17.
#   cp .env.example .env   # then set POSTGRES_PASSWORD and SECRET_KEY_BASE
#   docker compose up --build
services:
  db:
    image: postgres:17.11
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oms_api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: oms_api_production
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d oms_api_production"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    image: oms-api:1.0.0
    environment:
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-oms_api}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
      SENDER_EMAIL: ${SENDER_EMAIL:-support@example.com}
      OMS_STORE_FRONT_BASE_URL: ${OMS_STORE_FRONT_BASE_URL:-http://localhost:3001}
      # No SMTP server locally: mail is built and discarded.
      MAIL_DELIVERY_METHOD: test
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /app/tmp:uid=1000,gid=1000,mode=0755
      - /tmp
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres:
